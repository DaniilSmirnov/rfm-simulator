# coturn settings shared by every relay; entrypoint.sh adds the secret, the
# public address and TLS. See docs/TURN_SERVERS.md.

# Plain STUN/TURN on 3478 (UDP and TCP); TURN over TLS on TURN_TLS_PORT
# (443 by default: networks that let nothing else out still let HTTPS out).
listening-port=3478
# Relayed traffic. Open this UDP range in the firewall.
min-port=49160
max-port=49999

# Passwords from the room server: username "<expiry>:<player>",
# password base64(HMAC-SHA1(TURN_SECRET, username)).
use-auth-secret
realm=rally
fingerprint
stale-nonce=600

# Only game traffic: no TCP relays, no admin console, never relay into
# private, loopback or link-local networks (the server's own LAN).
no-tcp-relay
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# A room is at most 8 players, each with a game link and radio links: a
# player never needs more than a few allocations. 2 Mbit/s per allocation is
# far above a game link (tens of kbit/s) and stops anyone from using the
# relay as a free pipe.
user-quota=16
total-quota=2000
max-bps=250000

log-file=stdout
simple-log
