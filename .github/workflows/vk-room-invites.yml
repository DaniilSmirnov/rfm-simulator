name: VK room invitations
on:
  pull_request:
    paths:
      - web/platform/vk.js
      - web/platform/transport.js
      - game/scripts/platform_service.gd
      - game/scripts/game.gd
      - game/scripts/room.gd
      - game/tests/test_room_origin.gd
      - game/scripts/room_origin_probe.gd
      - game/scripts/room_origin_probe.tscn
      - scripts/build-web.mjs
      - scripts/test-platform-web.mjs
      - game/tests/test_vk_invite_ui.gd
      - tests/platform.test.mjs
      - .github/workflows/vk-room-invites.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invite-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify VK Bridge invitation transport and launch parameters
        run: node --test tests/platform.test.mjs
      - name: Verify VK-only in-game button and launch UI with Godot
        run: |
          node --input-type=module <<'JS'
          import { getGodot, run } from './scripts/godot.mjs';
          const godot = await getGodot();
          run(godot, ['--headless', '--editor', '--path', 'game', '--import']);
          run(godot, ['--headless', '--path', 'game', '--script', 'res://tests/test_vk_invite_ui.gd']);
          run(godot, ['--headless', '--path', 'game', '--script', 'res://tests/test_room_origin.gd']);
          JS
