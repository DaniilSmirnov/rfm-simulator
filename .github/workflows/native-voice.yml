name: Build native voice extension

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/voice/**'
      - '.github/workflows/native-voice.yml'
  push:
    branches: [main]
    paths:
      - 'native/voice/**'
      - '.github/workflows/native-voice.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libopus-dev
      - name: Fetch matching godot-cpp
        run: git clone --depth 1 --branch 4.4 https://github.com/godotengine/godot-cpp.git .cache/godot-cpp
      - name: Configure
        run: cmake -S native/voice -B native/voice/build -G Ninja -DGODOT_CPP_DIR=$PWD/.cache/godot-cpp -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build native/voice/build --parallel 2
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: rally-voice-linux-x86_64
          path: native/voice/build/rally_voice.so
