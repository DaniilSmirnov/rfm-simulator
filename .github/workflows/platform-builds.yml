name: Platform builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vk-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:vk
  build:
    needs: vk-auth
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: standalone
            command: build
            directory: dist
            config: wrangler.jsonc
          - target: vk
            command: build:vk
            directory: dist-vk
            config: wrangler.vk.jsonc
          - target: vk-prototype
            command: build:vk:prototype
            directory: dist-vk-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - run: node scripts/test-platform-build.mjs ${{ matrix.directory }}
      - name: Validate deploy configuration without publishing
        if: matrix.config != ''
        run: npx wrangler deploy --config ${{ matrix.config }} --dry-run --outdir .cache/worker
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify exported platform roundtrip (VK uses synthetic launch and API fixture)
        run: node scripts/test-platform-web.mjs ${{ matrix.directory }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.target }}
          path: ${{ matrix.directory }}/
          if-no-files-found: error
