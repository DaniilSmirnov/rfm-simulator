name: Game and Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-visuals:
    name: Tests and visuals
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      LIBGL_ALWAYS_SOFTWARE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Render text flag faces
        run: xvfb-run -a .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --path game --rendering-method gl_compatibility --script res://tests/flag_preview.gd
      - name: Render imported reference-style characters
        run: xvfb-run -a .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --path game --rendering-method gl_compatibility --script res://tests/character_preview.gd
      - name: Render cooking stages
        run: xvfb-run -a .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --path game --rendering-method gl_compatibility --script res://tests/cooking_preview.gd
      - name: Render landscape mobile controls
        run: xvfb-run -a .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --path game --rendering-method gl_compatibility --script res://tests/mobile_preview.gd
      - name: Render vineyard and village reference views
        run: xvfb-run -a .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --path game --rendering-method gl_compatibility --script res://tests/city_preview.gd
      - name: Render mushroom textures and verify color inversion
        run: xvfb-run -a .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --path game --rendering-method gl_compatibility --script res://tests/mushroom_preview.gd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-previews
          path: |
            flag-*.png
            character-preview.png
            cooking-*.png
            mobile-*.png
            vineyard-*.png
            preview-artifacts/mushrooms-*.png
          if-no-files-found: warn

  production-web:
    name: Production web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify two native multiplayer clients
        run: node scripts/test-multiplayer.mjs

      - name: Verify production artifacts
        run: |
          node scripts/test-platform-build.mjs dist
          node scripts/test-platform-build.mjs dist/vk
          npm run test:server

      - name: Validate Worker deploy configuration
        run: |
          mkdir -p .cache
          printf '%s' '{"VK_APP_SECRET":"ci-dry-run-only"}' > .cache/ci-secrets.json
          chmod 600 .cache/ci-secrets.json
          npx wrangler deploy --dry-run --outdir .cache/worker --secrets-file .cache/ci-secrets.json
          rm -f .cache/ci-secrets.json

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Verify standalone and VK browser roundtrips
        run: |
          node scripts/test-platform-web.mjs dist
          node scripts/test-platform-web.mjs dist/vk

      - name: Detect physical Web template
        id: physics
        run: node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "enabled=" + Boolean(JSON.parse(fs.readFileSync("engine/manifest.json")).physics_3d) + "\n");'

      - name: Verify exported physics in Chromium
        if: steps.physics.outputs.enabled == 'true'
        run: |
          node scripts/test-web-startup.mjs
          node scripts/test-web-physics.mjs
          node scripts/test-multiplayer.mjs --web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-production
          path: |
            dist/
            branding-loading*.png
            web-startup-*.png
            network-test.log
          if-no-files-found: warn

  vk-prototype:
    name: VK prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vk:prototype
      - run: node scripts/test-platform-build.mjs dist-vk-prototype

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Verify prototype browser roundtrip
        run: node scripts/test-platform-web.mjs dist-vk-prototype

      - uses: actions/upload-artifact@v4
        with:
          name: web-vk-prototype
          path: dist-vk-prototype/
          if-no-files-found: error
