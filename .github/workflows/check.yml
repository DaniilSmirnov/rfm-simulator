name: Game and Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run. Runs on main
# are never cancelled: every merged commit gets a complete result.
concurrency:
  group: game-web-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-and-visuals:
    name: Tests and visuals
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [core, simulation, world]
    env:
      WRANGLER_SEND_METRICS: "false"
      LIBGL_ALWAYS_SOFTWARE: "true"
      # Downloaded and verified by scripts/godot.mjs during the test shard.
      GODOT: .cache/godot/Godot_v4.4.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint GDScript (preload paths, records, layers, size budget)
        run: node scripts/lint-gdscript.mjs
      - name: Run isolated and audited Godot test shard
        run: node scripts/test-game.mjs --shard=${{ matrix.shard }}

      - name: Render desktop and mobile lobby
        # Previews are taken even when a test failed: they help diagnose it.
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --script res://tests/previews/lobby_preview.gd
      - name: Render lightweight menu and staged loading
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --script res://tests/previews/memory_preview.gd
      - name: Render text flag faces
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --rendering-method gl_compatibility --script res://tests/previews/flag_preview.gd
      - name: Render imported reference-style characters
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --rendering-method gl_compatibility --script res://tests/previews/character_preview.gd
      - name: Render cooking stages
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --rendering-method gl_compatibility --script res://tests/previews/cooking_preview.gd
      - name: Render landscape mobile controls
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --rendering-method gl_compatibility --script res://tests/previews/mobile_preview.gd
      - name: Render vineyard and village reference views
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --rendering-method gl_compatibility --script res://tests/previews/city_preview.gd
      - name: Render mushroom textures and verify color inversion
        if: matrix.shard == 'world' && !cancelled()
        run: xvfb-run -a $GODOT --path game --rendering-method gl_compatibility --script res://tests/previews/mushroom_preview.gd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-previews-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .cache/test-results/*.json
            .cache/ui-screens/*.png
            flag-*.png
            character-preview.png
            cooking-*.png
            mobile-*.png
            vineyard-*.png
            preview-artifacts/mushrooms-*.png
          if-no-files-found: warn

  production-web:
    name: Production web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify two native multiplayer clients
        run: node scripts/test-multiplayer.mjs
      - name: Verify two native multiplayer clients over WebSocket
        run: node scripts/test-multiplayer.mjs --socket

      - name: Verify production artifacts
        run: |
          node scripts/test-platform-build.mjs dist
          node scripts/test-platform-build.mjs dist/vk
          npm run test:server

      - name: Validate Worker deploy configuration
        run: |
          mkdir -p .cache
          printf '%s' '{"VK_APP_SECRET":"ci-dry-run-only"}' > .cache/ci-secrets.json
          chmod 600 .cache/ci-secrets.json
          npx wrangler deploy --dry-run --outdir .cache/worker --secrets-file .cache/ci-secrets.json
          rm -f .cache/ci-secrets.json

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Verify standalone and VK browser roundtrips
        run: |
          node scripts/test-platform-web.mjs dist
          node scripts/test-platform-web.mjs dist/vk
          node scripts/test-room-input-web.mjs
          node scripts/test-voice-web.mjs

      - name: Detect physical Web template
        id: physics
        run: node -e 'const fs = require("node:fs"); const m = JSON.parse(fs.readFileSync("engine/manifest.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "enabled=" + Boolean(m.physics_3d) + "\nwebsocket=" + Boolean(m.websocket) + "\nwebrtc=" + Boolean(m.webrtc) + "\n");'

      - name: Verify exported physics in Chromium
        if: steps.physics.outputs.enabled == 'true'
        run: |
          node scripts/test-web-startup.mjs
          node scripts/test-web-physics.mjs
          node scripts/test-multiplayer.mjs --web

      - name: Verify browser multiplayer over WebSocket and the WebRTC direct link
        if: steps.physics.outputs.websocket == 'true'
        run: node scripts/test-multiplayer.mjs --web --socket

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-production
          path: |
            dist/
            branding-loading*.png
            web-startup-*.png
            network-test.log
          if-no-files-found: warn

  vk-prototype:
    name: VK prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vk:prototype
      - run: node scripts/test-platform-build.mjs dist-vk-prototype

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Verify prototype browser roundtrip
        run: node scripts/test-platform-web.mjs dist-vk-prototype

      - uses: actions/upload-artifact@v4
        with:
          name: web-vk-prototype
          path: dist-vk-prototype/
          if-no-files-found: error

  native-voice:
    name: Native radio (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28: the library loads on every distribution Godot supports.
          - {target: linux-x86_64, os: ubuntu-24.04, container: "quay.io/pypa/manylinux_2_28_x86_64"}
          - {target: windows-x86_64, os: ubuntu-24.04}
          - {target: windows-x86_32, os: ubuntu-24.04}
          - {target: macos-universal, os: macos-14}
          - {target: android-arm64, os: ubuntu-24.04}
          - {target: android-arm32, os: ubuntu-24.04}
    env:
      # Bump to rebuild every library without a source change, for example
      # after a toolchain change in the install step below.
      VOICE_BUILD_EPOCH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The library depends only on its sources, the pinned deps and the build
      # script. A run that changes none of them reuses the library built for
      # them earlier and skips the toolchain and the build.
      - name: Restore a built library
        id: lib
        uses: actions/cache/restore@v4
        with:
          path: game/addons/rally_voice/bin
          key: voice-lib-${{ matrix.target }}-${{ env.VOICE_BUILD_EPOCH }}-${{ hashFiles('native/voice/**', 'scripts/build-voice.mjs') }}
      - name: Install build tools
        if: steps.lib.outputs.cache-hit != 'true'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux-*) echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"; /opt/python/cp312-cp312/bin/pip install -q cmake ninja ;;
            windows-*) sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ninja-build mingw-w64 g++-mingw-w64 ;;
            macos-*) brew install ninja ;;
            android-*) sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ninja-build ;;
          esac
      - uses: actions/cache@v4
        if: steps.lib.outputs.cache-hit != 'true'
        with:
          path: .cache/voice
          key: voice-${{ matrix.target }}-${{ hashFiles('native/voice/deps.json') }}-${{ hashFiles('native/voice/**') }}
          restore-keys: voice-${{ matrix.target }}-${{ hashFiles('native/voice/deps.json') }}-
      - name: Build the extension
        if: steps.lib.outputs.cache-hit != 'true'
        shell: bash
        run: node scripts/build-voice.mjs --target=${{ matrix.target }}
      - name: Check the library
        shell: bash
        run: |
          lib=$(ls game/addons/rally_voice/bin/librally_voice.*)
          ls -la $lib
          if command -v file >/dev/null; then file $lib; fi
          case "${{ matrix.target }}" in
            linux-*) ! objdump -T $lib | grep -oE "GLIBC_2\.(29|[3-9][0-9])" ;;
            macos-*) lipo -info $lib | grep -q "x86_64 arm64\|arm64 x86_64" ;;
          esac
      - name: Save the built library
        if: steps.lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: game/addons/rally_voice/bin
          key: ${{ steps.lib.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.target }}
          path: game/addons/rally_voice/bin/
          retention-days: 7
          if-no-files-found: error

  native-voice-test:
    name: Native radio (loopback and browser interop)
    needs: native-voice
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: voice-linux-x86_64
          path: game/addons/rally_voice/bin
      - run: node scripts/build-voice.mjs --install
      - name: Native links, Opus and the mesh in Godot
        run: RFM_REQUIRE_NATIVE_VOICE=1 node scripts/test-game.mjs --only=test_voice_native.gd
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Native Godot client talks with a Chromium client
        run: node scripts/test-voice-interop.mjs
      - name: Native direct link opens with a Chromium client
        run: node scripts/test-direct-interop.mjs

  android:
    name: Android build
    needs: native-voice
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Store builds are signed with GODOT_ANDROID_KEYSTORE_RELEASE_* secrets when they exist;
      # pull requests get a throwaway key made by the build script.
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Add the native radio extension
        uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          merge-multiple: true
          path: game/addons/rally_voice/bin
      - run: node scripts/build-voice.mjs --install
      - name: Export the release APK (production server, arm64 and armv7)
        run: npm run build:android
      - name: Check package name, version and signature
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/34.* | sort -V | tail -1)
          apk="dist-android/Rally Fans Simulator.apk"
          "$tools/aapt2" dump badging "$apk" | tee badging.txt | grep -E "^package:|native-code|sdkVersion"
          grep -q "name='ru.rallyfansmap.rallyfanssimulator'" badging.txt
          grep -q "android.permission.RECORD_AUDIO" badging.txt
          unzip -l "$apk" > apk.txt
          if ! grep -q "librally_voice.android.arm64.so" apk.txt; then unzip -p "$apk" "assets/*.pck" | grep -qa "librally_voice.android.arm64.so"; fi
          "$tools/apksigner" verify --verbose "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: Desktop build (${{ matrix.platform }})
    needs: native-voice
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, linux, windows, windows-demo, macos-demo]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Wine for the exe icon and file properties (rcedit)
        if: startsWith(matrix.platform, 'windows')
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends wine wine64
      - run: npm ci
      - name: Add the native radio extension
        uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          merge-multiple: true
          path: game/addons/rally_voice/bin
      - run: node scripts/build-voice.mjs --install
      - name: Export the release build (Windows x86 + x64, others x86_64/universal; *-demo is the solo demo)
        run: npm run build:${{ matrix.platform }}
      - name: Check the executable format
        run: |
          if [ "${{ matrix.platform }}" = macos ] || [ "${{ matrix.platform }}" = macos-demo ]; then
            unzip -q dist-${{ matrix.platform }}/*.zip -d macos-check
            file macos-check/*.app/Contents/MacOS/* | tee file.txt
            grep -q "Mach-O universal binary with 2 architectures" file.txt
            if [ "${{ matrix.platform }}" = macos ]; then
              grep -qa "addons/rally_voice/bin/librally_voice.macos.universal.dylib" macos-check/*.app/Contents/Resources/*.pck
            fi
          elif [ "${{ matrix.platform }}" = windows-demo ]; then
            node scripts/verify-windows-build.mjs dist-windows-demo Rally_Fans_Simulator_Demo
          elif [ "${{ matrix.platform }}" = windows ]; then
            node scripts/verify-windows-build.mjs dist-windows
            # The radio library rides inside each exe's embedded pack.
            grep -qa "addons/rally_voice/bin/librally_voice.windows.x86_64.dll" dist-windows/Rally_Fans_Simulator_x64.exe
            grep -qa "addons/rally_voice/bin/librally_voice.windows.x86_32.dll" dist-windows/Rally_Fans_Simulator_x86.exe
          else
            file dist-${{ matrix.platform }}/* | tee file.txt && grep -qE "ELF 64-bit LSB.*x86-64|PE32\+ executable.*x86-64" file.txt
            grep -qa "addons/rally_voice/bin/librally_voice.linux.x86_64.so" dist-linux/*.pck
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}/
          retention-days: 7
          if-no-files-found: error

  windows-startup:
    name: Windows standalone startup (${{ matrix.build.artifact }}, x86 + x64)
    needs: desktop
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        build:
          - {artifact: desktop-windows, stem: Rally_Fans_Simulator}
          - {artifact: desktop-windows-demo, stem: Rally_Fans_Simulator_Demo}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build.artifact }}
          path: dist-windows
      - name: Launch each exe alone from an isolated directory
        run: node scripts/test-windows-startup.mjs dist-windows ${{ matrix.build.stem }}
