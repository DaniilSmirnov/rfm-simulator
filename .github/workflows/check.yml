name: Game and Web
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:server
      - run: npx wrangler deploy --dry-run --outdir .cache/worker

      - name: Render city reference views
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --path game --rendering-method gl_compatibility --script res://tests/city_preview.gd
      - uses: actions/upload-artifact@v4
        with:
          name: city-preview
          path: city-*.png
          if-no-files-found: error

      - name: Detect physical Web template
        id: physics
        run: node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "enabled=" + Boolean(JSON.parse(fs.readFileSync("engine/manifest.json")).physics_3d) + "\n");'
      - name: Verify exported physics in Chromium
        if: steps.physics.outputs.enabled == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/test-web-physics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branding-loading
          path: .cache/branding-loading.png
          if-no-files-found: warn
