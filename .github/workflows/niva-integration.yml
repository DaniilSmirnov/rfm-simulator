name: Niva OBJ integration
on:
  pull_request:
    paths:
      - "game/models/cars/niva/**"
      - "game/scripts/niva_asset.gd"
      - "game/scripts/props.gd"
      - "game/tests/test_niva_integration.gd"
      - "game/tools/verify_niva_asset.gd"
      - ".github/workflows/niva-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  niva-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import OBJ assets and exercise Niva trunk and cargo tests
        run: |
          node --input-type=module <<'JS'
          import { getGodot, run } from './scripts/godot.mjs';
          const godot = await getGodot();
          run(godot, ['--headless', '--editor', '--path', 'game', '--import']);
          for (const test of [
            'res://tools/verify_niva_asset.gd',
            'res://tests/test_niva_integration.gd',
            'res://tests/test_trunk.gd',
          ]) {
            console.log('Niva CI test:', test);
            run(godot, ['--headless', '--path', 'game', '--script', test]);
          }
          JS
