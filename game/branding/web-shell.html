<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>$GODOT_PROJECT_NAME · Rally Fans Map</title>
<style>
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; touch-action:none; font-family:Arial,sans-serif; }
#canvas { display:block; outline:none; }
#status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; z-index:100; }
.loading-card { width:min(360px,calc(100vw - 64px)); text-align:center; max-height:calc(100dvh - 32px); overflow:auto; touch-action:pan-y; }
#status-splash { width:clamp(96px,24vh,160px); height:auto; display:block; margin:0 auto 24px; }
h1 { font-size:clamp(25px,5vw,34px); font-weight:600; margin:0 0 28px; letter-spacing:.02em; }
#status-progress { height:8px; width:100%; overflow:hidden; border-radius:8px; background:#242424; }
#status-fill { width:38%; height:100%; border-radius:inherit; background:#ff3b0a; }
#status-progress.indeterminate #status-fill { animation:loading 1.5s ease-in-out infinite alternate; }
@keyframes loading { from { transform:translateX(-40%); } to { transform:translateX(205%); } }
@media(prefers-reduced-motion:reduce) { #status-progress.indeterminate #status-fill { animation:none; transform:none; } }
#status-label { color:#aaa; font-size:14px; margin:14px 0 0; }
#status-notice { color:#fff; line-height:1.5; white-space:pre-line; margin:24px 0 0; }
#status-stage { color:#aaa; font-size:13px; margin:12px 0; }
#status-details { margin-top:20px; text-align:left; }
#status-log { max-height:180px; overflow:auto; font-size:11px; white-space:pre-wrap; overflow-wrap:anywhere; }
#status button { padding:10px 16px; margin-top:12px; border:1px solid #555; border-radius:8px; background:#242424; color:#fff; }
[hidden] { display:none !important; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Ваш браузер не поддерживает canvas.</canvas>
<noscript>Для игры Rally Fans Map нужно включить JavaScript.</noscript>
<div id="status">
  <div class="loading-card">
    <img id="status-splash" src="favicon.svg" width="180" height="180" alt="Логотип Rally Fans Map">
    <h1 id="status-brand">Rally Fans Map</h1>
    <div id="status-progress" class="indeterminate" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100"><div id="status-fill"></div></div>
    <p id="status-label" aria-live="polite">Загрузка игры…</p>
    <p id="status-stage" aria-live="polite">Проверка браузера</p>
    <div id="status-notice" role="alert" hidden></div>
    <button id="status-retry" type="button" hidden>Повторить запуск</button>
    <details id="status-details" hidden><summary>Технические подробности</summary><pre id="status-log" tabindex="0"></pre><button id="status-copy" type="button">Скопировать отчёт</button></details>
  </div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const boot = globalThis.RallyBoot;
boot?.install("$RFM_VERSION");
GODOT_CONFIG.onPrint = (...args) => boot ? boot.print(...args) : console.log(...args);
GODOT_CONFIG.onPrintError = (...args) => boot ? boot.printError(...args) : console.error(...args);
const engine = new Engine(GODOT_CONFIG);
const overlay = document.getElementById('status');
const progress = document.getElementById('status-progress');
const fill = document.getElementById('status-fill');
const label = document.getElementById('status-label');
function loadingProgress(current, total) {
  boot?.progress(current, total);
  if (total > 0 && current >= 0) {
    const percent = Math.max(0, Math.min(100, Math.floor(current / total * 100)));
    progress.classList.remove('indeterminate');
    progress.setAttribute('aria-valuenow', percent);
    fill.style.width = percent + '%';
    label.textContent = percent === 100 ? 'Запуск игры…' : 'Загрузка игры · ' + percent + '%';
  } else {
    progress.classList.add('indeterminate');
    progress.removeAttribute('aria-valuenow');
    fill.style.width = '38%';
    label.textContent = 'Загрузка игры…';
  }
}
function loadingFailure(error) {
  if (boot) { boot.fail(error); return; }
  console.error(error);
  progress.hidden = true;
  label.hidden = true;
  const notice = document.getElementById('status-notice');
  notice.textContent = error instanceof Error ? error.message : String(error);
  notice.hidden = false;
}
const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
if (missing.length) {
  loadingFailure('Браузер не поддерживает необходимые функции:\n' + missing.join('\n'));
} else {
  boot?.setStage('Загрузка файлов движка');
  engine.startGame({ onProgress: loadingProgress }).then(() => boot ? boot.ready() : overlay.remove(), loadingFailure);
}
</script>
</body>
</html>
